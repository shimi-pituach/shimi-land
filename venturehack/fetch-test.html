<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"/><title>בדיקת fetch</title></head>
<body><pre id="out">מריץ…</pre>
<script>
(async () => {
  try {
    const r = await fetch('https://base44.app/api/apps/6a901f55a4d9a9b76a095a77/functions/mishmeretLedgerCount');
    const t = await r.text();
    document.getElementById('out').textContent = 'HTTP ' + r.status + '\n' + t.slice(0, 300);
  } catch (e) {
    document.getElementById('out').textContent = 'כשל: ' + String(e);
  }
})();
</script></body></html>
