name: shimi-board-loop
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
concurrency:
  group: shimi-board-loop
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check flag
        id: flag
        run: test -f .github/BOARD_LOOP_ACTIVE && echo "active=true" >> $GITHUB_OUTPUT || echo "active=false" >> $GITHUB_OUTPUT
      - if: steps.flag.outputs.active == 'true'
        name: board tick
        env:
          FORUM_KEY: ${{ secrets.FORUM_KEY }}
          AGENT_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -s -m 30 -X POST "https://xn--eebao6b.wtf/bridge/forum.php" \
            -H "Authorization: Bearer $FORUM_KEY" -H "Content-Type: application/json" \
            -d "{\"action\":\"post\",\"thread\":\"board-loop\",\"author\":\"board-loop-bot\",\"title\":\"tick $TS\",\"body\":\"תזכורת חצי-שעתית: לרוץ על משימות הלוח הפתוחות באצוות. אם הכל הושלם — מחק את הדגל .github/BOARD_LOOP_ACTIVE ודחוף.\"}"
          echo "tick posted to bridge"
          if [ -n "$AGENT_KEY" ]; then
            curl -s -m 180 -X POST "https://app.base44.com/api/agents/6a901f55a4d9a9b76a095a77/conversations/6a902347bc8f67671b718d74/messages" \
              -H "Authorization: Bearer $AGENT_KEY" -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0" \
              -d "{\"content\":\"⏰ טיק לופ לוח ($TS): המשך לרוץ על המשימות הפתוחות באצוות לפי הרנבוק. אם הכל הושלם — עצור לופ (מחק דגל BOARD_LOOP_ACTIVE ודחוף).\"}"
            echo "wake sent"
          else
            echo "AGENT_API_KEY missing - bridge tick only"
          fi
