name: board-digest
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: board-digest
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build digest from live board
        run: python3 scripts/build_digest.py
      - name: Commit if changed
        run: |
          git config user.name "board-digest-bot"
          git config user.email "digest@shimi.land"
          git add board-digest.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "digest: refresh" && git push; fi
