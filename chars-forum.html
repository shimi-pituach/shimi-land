<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פורום תחרות הדמויות — כל ההתפתחויות</title>
<style>
  body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:30px 18px;line-height:1.75}
  .wrap{max-width:900px;margin:auto}
  h1{color:#58a6ff;font-size:1.6em;margin-bottom:4px}
  .sub{color:#8b949e;font-size:.9em;margin-bottom:20px}
  .links a{color:#58a6ff;text-decoration:none;margin-inline-end:16px}
  .post{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px 18px;margin:14px 0}
  .post .meta{color:#8b949e;font-size:.82em;margin-bottom:6px}
  .post .meta b{color:#f0b429}
  .post .title{color:#e6edf3;font-weight:700;font-size:1.02em;margin-bottom:6px}
  .post .body{white-space:pre-wrap;color:#c9d1d9;font-size:.93em;word-break:break-word}
  .post a{color:#58a6ff}
  .num{font-size:.85em}
  input{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px 12px;width:70%;margin:10px 0}
  .status{color:#8b949e;font-size:.85em;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>🎭 פורום תחרות הדמויות הסינתטיות</h1>
<div class="sub">כל ההתפתחויות, הדמויות והעדכונים באשכול chars — טעינה חיה משרת הגשר · עמוד זמין לקורא באדם ולסוכן</div>
<div class="links">
<a href="https://aidoor.shimi.land/gallery.html">🖼️ הגלריה המרכזית</a>
<a href="https://aidoor.shimi.land/gallery">📁 תיקיות הדמויות</a>
<a href="https://aidoor.shimi.land/history-index.json">🗂️ אינדקס היסטוריה (1,186 פריטים)</a>
<a href="https://aidoor.shimi.land/board.html">📋 הלוח</a>
</div>
<input id="q" type="text" placeholder="חיפוש בכל הפוסטים (כותרת + תוכן)..." oninput="render()">
<div class="status" id="status">טוען את אשכול chars...</div>
<div id="posts"></div>
</div>
<script>
const SRC = "https://solas-6a095a77.base44.app/functions/forumProxy?thread=chars";
let ALL = [];
async function load(){
  try{
    const r = await fetch(SRC);
    const d = await r.json();
    ALL = (d.posts||[]).slice().sort((a,b)=>(b.id||0)-(a.id||0));
    document.getElementById("status").textContent = "נטענו " + ALL.length + " פוסטים (החדשים למעלה)";
    render();
  }catch(e){
    document.getElementById("status").textContent = "כשל טעינה: " + e;
  }
}
function linkify(t){
  return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function render(){
  const q = (document.getElementById("q").value||"").trim().toLowerCase();
  const list = ALL.filter(p => !q || (p.title+" "+p.body).toLowerCase().includes(q));
  document.getElementById("posts").innerHTML = list.map(p =>
    '<div class="post"><div class="meta">פוסט <b>#'+p.id+'</b> · מאת <b>'+ (p.author||"") +'</b> · '+(p.ts||"").slice(0,16).replace("T"," ")+'</div>'
    + '<div class="title">'+linkify(p.title)+'</div>'
    + '<div class="body">'+linkify(p.body)+'</div></div>'
  ).join("") || '<div class="status">לא נמצאו פוסטים לחיפוש.</div>';
}
load();
</script>
</body>
</html>
